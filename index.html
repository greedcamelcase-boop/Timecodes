els.list.addEventListener('focusout', e => {      // на сенсорных экранах кнопки исчезают, когда фокус ушёл с записи
  if (!(window.matchMedia && matchMedia('(hover:none)').matches)) return;
  const row = e.target.closest && e.target.closest('.row');
  if (!row || (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.row'))) return;
  setTimeout(() => { if (tools.parentNode && !toolsRowFocused()) tools.remove(); }, 0);
});
els.list.addEventListener('focusin', e => {
  const row = e.target.closest && e.target.closest('.row');
  if (row && e.target === row) {
    for (const r of els.list.querySelectorAll('.row[tabindex="0"]')) if (r !== row) r.tabIndex = -1;
    row.tabIndex = 0;
  }
  moveTools(row);
});
els.list.addEventListener('dblclick', e => {
  const b = e.target.closest('.chip, .txt'); if (!b) return;
  const row = b.closest('.row'); if (row && !row.classList.contains('editing')) startEdit(row.dataset.id);
});
els.list.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f || !state.edit) return;
  state.edit[f] = e.target.value;
  if (f === 'tc' && state.edit.err) {
    state.edit.err = '';
    const row = e.target.closest('.row'); const er = $('.e-err', row); er.hidden = true; e.target.classList.remove('bad');
  }
});
els.list.addEventListener('keydown', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); saveEdit(); return; }
  // Управление с клавиатуры, когда фокус на самой строке
  if (t.classList && t.classList.contains('row') && !e.ctrlKey && !e.altKey && !e.metaKey) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const n = e.key === 'ArrowDown' ? t.nextElementSibling : t.previousElementSibling;
      if (n && n.classList.contains('row')) n.focus();
    } else if (e.key === 'Enter' || e.key === 'F2') { e.preventDefault(); startEdit(t.dataset.id); }
    else if (e.key === 'Delete') {
      e.preventDefault();
      const nb = t.nextElementSibling || t.previousElementSibling;
      deleteEntry(t.dataset.id, { focusId: nb && nb.classList.contains('row') ? nb.dataset.id : null });
    }
  }
});

els.overlay.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) {
    const a = b.dataset.act;
    if (a === 'close') closeOverlay();
    else if (a.startsWith('sync-')) syncAction(a);
    else if (a === 'exp-json') doExport('json');
    else if (a === 'exp-csv') doExport('csv');
    else if (a === 'exp-txt') doExport('txt');
    else if (a === 'imp-pick') pickImportFile();
    else if (a === 'imp-cancel') { state.imp = null; renderDialog(); }
    else if (a === 'imp-back') { state.imp.confirm = false; renderDialog(); }
    else if (a === 'imp-next') { if (state.imp.mode === 'replace') { state.imp.confirm = true; renderDialog(); } else runImport(); }
    else if (a === 'imp-go') { const bk = $('#bk'); if (bk) state.imp.backupFirst = bk.checked; runImport(); }
    return;
  }
  const r = e.target.closest('.res');
  if (r) goToEntry(r.dataset.id);
});
els.overlay.addEventListener('change', e => {
  if (e.target.name === 'mode' && state.imp) { state.imp.mode = e.target.value; renderDialog(); const r = els.overlay.querySelector('input[name=mode]:checked'); if (r) r.focus(); }
});
els.overlay.addEventListener('input', e => {
  if (e.target.id === 'sq') { S.q = e.target.value; S.results = runSearch(S.q); S.sel = 0; renderSearchResults(); }
  else if (e.target.dataset && e.target.dataset.sf && state.syncUI) state.syncUI.draft[e.target.dataset.sf] = e.target.value;
});
els.overlay.addEventListener('keydown', e => {
  if (state.overlay === 'sync' && e.key === 'Enter' && e.target.dataset && e.target.dataset.sf && !e.isComposing) { e.preventDefault(); enableSync(); return; }
  if (state.overlay !== 'search' || e.target.id !== 'sq') return;
  if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  else if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); const r = S.results[S.sel]; if (r) goToEntry(r.id); }
});

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  const t = e.target;
  const typing = !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);

  if (mod && !e.altKey && !e.shiftKey && e.code === 'KeyF') { e.preventDefault(); openSearch(); return; }

  if (e.key === 'Escape') {
    if (state.overlay) { e.preventDefault(); closeOverlay(); return; }
    if (sideOpen()) { e.preventDefault(); closeSide(); return; }
    if (state.edit) { e.preventDefault(); cancelEdit(); return; }
    return;
  }

  if (mod && !e.altKey && !e.shiftKey && e.code === 'KeyZ') {
    if (state.overlay) return;
    if (typing) {
      const inAdd = t === els.tc || t === els.desc;
      if (!(inAdd && !els.tc.value && !els.desc.value)) return; // обычная отмена ввода текста
    }
    e.preventDefault(); undoLast(); return;
  }

  if (e.altKey && !mod && (e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !state.overlay) {
    e.preventDefault();
    selectDate(addDays(state.selected, e.code === 'ArrowLeft' ? -1 : 1));
    return;
  }

  // Цифра при фокусе вне полей — сразу в поле таймкода
  if (!typing && !mod && !e.altKey && !state.overlay && /^[0-9]$/.test(e.key) && state.storageOk && !(t.closest && t.closest('#calGrid'))) {
    els.tc.focus();
  }
});

window.addEventListener('beforeunload', e => { if (state.pending > 0) { e.preventDefault(); e.returnValue = ''; } });

/* Обновление при возвращении в окно: вдруг данные менялись в другом окне */
let refreshing = false;
async function refreshFromDB() {
  const t = todayISO();
  if (t !== state.today) { state.today = t; renderSide(); }
  if (state.sync) scheduleSync(200);
  if (!state.storageOk || refreshing || state.pending > 0 || state.overlay) return;
  refreshing = true;
  try {
    const all = await dbGetAll();
    if (state.pending > 0) return;
    const prev = state.sig;
    idxReset(all);
    for (const e of all) if (stampOf(e) > state.lastStamp) state.lastStamp = stampOf(e);
    const sig = signature();
    if (sig !== prev) {
      state.sig = sig;
      if (state.edit && !byId.has(state.edit.id)) state.edit = null;
      renderCalendar(); renderHead(); renderList(); renderBackupStatus();
    }
  } catch (_) { /* не критично */ }
  finally { refreshing = false; }
}
window.addEventListener('focus', refreshFromDB);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshFromDB(); });

/* =====================================================================
   Запуск
   ===================================================================== */
async function init() {
  renderHint();
  try {
    db = await openDB();
    state.storageOk = true;
    const [all, meta] = await Promise.all([dbGetAll(), dbGetMeta()]);
    idxReset(all);
    state.meta = meta || {};
    const sc = meta && meta.sync;
    if (sc && typeof sc.url === 'string' && typeof sc.key === 'string' && typeof sc.code === 'string') {
      state.sync = { url: sc.url, key: sc.key, code: sc.code, cursor: Number(sc.cursor) || 0 };
      state.syncStatus = { kind: 'busy' };
    }
    if (meta && (meta.sort === 'tc' || meta.sort === 'new' || meta.sort === 'old')) state.sort = meta.sort;
    if (meta && typeof meta.lastDate === 'string' && parseISO(meta.lastDate)) state.selected = meta.lastDate;
    for (const e of all) if (stampOf(e) > state.lastStamp) state.lastStamp = stampOf(e);
    state.sig = signature();
  } catch (err) {
    state.storageOk = false; state.storageErr = reasonOf(err);
  }
  const d = parseISO(state.selected);
  state.viewY = d.getFullYear(); state.viewM = d.getMonth();
  if (window.matchMedia && matchMedia('(max-width:760px)').matches) els.desc.placeholder = 'Описание';
  renderAll();
  if (state.storageOk && state.sync) { refreshQueueCount(); scheduleSync(300); }
  if (state.storageOk) {
    focusTc();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { state.persisted = v; }).catch(() => {});
  }
}
init();

})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
